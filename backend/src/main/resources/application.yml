spring:
  application:
    name: cutline
  datasource:
    url: jdbc:mysql://localhost:3306/cutline?serverTimezone=UTC&characterEncoding=UTF-8
    username: cutline
    password: cutline
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
