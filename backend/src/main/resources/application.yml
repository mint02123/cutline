spring:
  application:
    name: cutline
  threads:
    virtual:
      # 관문을 통과한 요청이 커넥션 풀(10)을 기다리며 Tomcat 스레드 200개를 다 쥐면, 관문에서 바로 끝날 품절자도
      # 스레드를 기다렸다 (품절 p95 4.78초). 가상 스레드에서는 0.94초. ADR-011, docs/reports/phase2-2-redis-gate.md
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/cutline?serverTimezone=UTC&characterEncoding=UTF-8
    username: cutline
    password: cutline
    hikari:
      data-source-properties:
        # UPDATE/UPSERT 결과로 "실제로 바뀐 행 수"를 받는다 (기본값은 "조건에 맞은 행 수").
        # 구매 한도 upsert에서 한도 초과(변경 없음 = 0)를 구분하기 위해 필요. ADR-003 참고.
        useAffectedRows: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms

management:
  endpoints:
    web:
      exposure:
        include: health,info

cutline:
  order:
    # 품절 선판정 (ADR-008). 끄면 1단계처럼 모든 요청이 재고 행 잠금 줄에 선다 (비교 측정용).
    sold-out-precheck: true
  gate:
    # Redis 1차 관문 (ADR-009). 끄면 모든 주문이 MySQL로 바로 간다 (2-1 경로).
    enabled: true
    # 관문 키 보관 기간. 드롭이 끝난 뒤 남은 키를 치운다.
    key-ttl: P7D
    fallback:
      # Redis에 닿지 못하면 이 시간 동안 관문을 건너뛰고 MySQL 경로로 간다 (요청마다 Redis 시간 초과를 기다리지 않게).
      skip-gate-for: PT2S
      # MySQL 경로로 동시에 들어가는 요청 수 (서버당). 넘으면 wait만큼 기다렸다가 503 TOO_BUSY.
      max-concurrent: 20
      wait: PT2S
    resync:
      # 토큰을 MySQL 남은 재고에 맞추는 주기. 모자란 토큰은 두 주기 연속 같을 때만 채운다.
      interval-ms: 5000
  queue:
    # 대기열 (설계 문서 2-3). 줄과 순번은 Redis sorted set에 있다.
    key-ttl: P7D
    # 초당 입장 인원. 7일차 입장 스케줄러가 쓰고, 지금은 예상 대기 시간 계산에만 쓴다.
    # 1단계 측정치(재고 행 초당 약 200건)에서 시작하고, 9일차 측정으로 다시 정한다.
    admit-per-second: 200
    poll:
      # 순번 조회 간격. 예상 대기의 절반마다 묻되 이 범위로 자른다.
      min-ms: 1000
      max-ms: 5000
  pg:
    # fake: 장애 주입이 되는 가짜 PG (1단계). 3단계에서 tosspayments 구현을 추가한다.
    provider: fake
    fake:
      delay-ms: 0             # 승인·조회·취소마다 걸리는 시간
      decline-rate: 0         # 거절 확률
      lost-response-rate: 0   # 승인은 됐는데 응답이 사라질 확률 (결제 UNKNOWN)
      timeout-rate: 0         # 요청이 PG에 닿지 않을 확률 (결제 UNKNOWN → 조회 후 FAILED)
  payment:
    reconciler:
      interval-ms: 5000
      # REQUESTED로 이만큼 머문 결제는 서버가 PG 호출 도중 죽은 것으로 보고 PG에 조회한다.
      # 실제 PG 연동 시 HTTP 타임아웃보다 충분히 길어야 한다.
      stale-requested-after: PT30S
